name: Java CI Build with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4  # Update to latest

      # Step 2: Set up JDK 11 (or whichever version you need)
      - name: Set up JDK 11
        uses: actions/setup-java@v4  # Update to latest
        with:
          distribution: 'temurin'
          java-version: '11'

      # Step 3: Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4  # Update to latest
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      # Step 4: Build the project with Maven
      - name: Build with Maven
        run: mvn -B clean install

      # Step 5: Run tests
      - name: Run tests
        run: mvn test

      # Step 6: Trigger workflow in another repository api-automation using repository_dispatch API
      #       -H "Authorization: token ${{ secrets.WORKFLOW_GIT_TOKEN }}" \
      - name: Trigger workflow in api-automation
        run: |
          curl -X POST \
            https://api.github.com/repos/kiritisagar/maven-project/dispatches \
            -H "Authorization: token ${{ secrets.TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"event_type": "trigger-build"}'
